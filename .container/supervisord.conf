[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/home/devops/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:frappe]
command=/bin/bash -lc "bench start"
directory=/home/devops/persistent/frappe-bench
user=devops
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/devops/logs/bench.log
stderr_logfile=/home/devops/logs/bench-error.log
