name: logicx-app

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-logicx_db_root}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --host=localhost --user=root --password=\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./50-server.cnf:/etc/mysql/mariadb.conf.d/50-server.cnf:ro

  frappe:
    build:
      context: .
      dockerfile: Dockerfile-frappe
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SITE_NAME: ${SITE_NAME:-logicx.localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-logicx_db_root}
      FRAPPE_BRANCH: ${FRAPPE_BRANCH:-version-16}
      ERPNEXT_BRANCH: ${ERPNEXT_BRANCH:-version-16}
      HOST_GID: ${HOST_GID:-1000}
    ports:
      - "${HTTP_PORT:-8000}:8000"
      - "${SOCKETIO_PORT:-9000}:9000"
    volumes:
      # Host-persistent Bench: available to code-server at
      # /home/logicx/frappe-bench and to Frappe at /home/devops/persistent.
      - ${FRAPPE_BENCH_HOST_PATH:-/home/logicx/frappe-bench}:/home/devops/persistent
      - ..:/workspace/logicx-app
      - logicx_node_modules:/workspace/logicx-app/node_modules
      - logicx_frontend_node_modules:/workspace/logicx-app/frontend/node_modules

volumes:
  mariadb_data:
  logicx_node_modules:
  logicx_frontend_node_modules:
